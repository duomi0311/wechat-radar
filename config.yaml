# 监控名单按用户提供名称填写；扫码后须逐一验证账号。
accounts:
- 山东高法
- 上海一中法院
- 天同诉讼圈
- icourt法秀
- 北大法宝
- 高杉LEGAL
profile:
  background: 关注法律实务、民商事诉讼与知识积累的专业读者
  expertise_level: advanced
  interests:
  - 民商事裁判规则与案例评析
  - 证据、举证责任与庭审实务
  - 民事程序、执行与财产保全
  - 合同、公司、担保及商事争议
  - 法律检索、诉讼方法与律师工作工具
  preferences:
    prefer_practical: true
    avoid_marketing_hype: true
  custom: 优先选择可积累的法律知识、具体裁判规则、证据方法和诉讼技巧。区分法律规定、法院个案观点与作者评论；保留原文的适用条件、例外和时间地域限制。未核实的案号、法条及现行有效性须标明待核实，不补造内容。活动通知、招聘、营销和纯新闻降低推荐优先级。
preferences:
  merge_mode: custom_only
  memory_files: []
  custom: 围绕指定六个公众号开展法律实务学习。内容准确、来源清楚、逻辑克制；无需每天凑数。
fetch:
  hours: 24
  request_interval: 1.5
branding:
  title: 知山 · 法律实务阅读
  footer: 知山｜原文学习整理，保留来源，待人工核验
ai:
  temperature: 0.3
  intro_temperature: 0.5
  max_content_length: 12000
  min_content_length: 50
  intro_style: 清晰克制地指出本次阅读涉及的具体法律争点。不将文章观点表述为已核实的现行法律，不使用夸张宣传或空泛抒情。
dedup:
  title_threshold: 0.5
prefilter:
  tech_whitelist:
  - 裁判|判决|司法解释|民法典|举证|证据|诉讼|保全|执行|管辖|合同|公司|担保
  ad_rules:
  - trigger: 限时
    keywords: 折扣|优惠|特价|秒杀|抢购
  - trigger: 免费领
    keywords: 课程|资料|电子书|模板|工具包
schedule:
  cron:
  - 0 9 * * *
  log_file: /tmp/wechat-radar.log
scoring:
  dimensions:
    relevance:
      description: 与民商事诉讼、裁判规则、证据及法律实务学习的相关度
      weight: 2
    depth:
      description: 是否说明裁判理由、法律争点、适用条件与例外，而非只报结论
      weight: 1
    info_density:
      description: 可核查规则、案件事实与具体方法的信息密度
      weight: 1
    actionability:
      description: 能否形成检索、举证、庭审或办案核对步骤
      weight: 2
    credibility:
      description: 是否清楚列明出处、案号或法律依据，并区分个案、规则与评论
      weight: 1
  min_score: 5
  top_n: 12
knowledge_cards:
  enabled: true
  max_content_length: 20000
